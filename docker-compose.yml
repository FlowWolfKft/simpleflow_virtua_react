version: "3.9"
name: simpleflow.cloud
services:
  vite-app:
    image: node:20
    container_name: simpleflow.cloud-app
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5176:5173"
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host"